<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fit Track - Login</title>

    <link rel="icon" type="image/png" href="images/icon-192.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/ui.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        emailjs.init("ZqQKGRo5j5KpAhH98");
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('ServiceWorker registered!'))
                    .catch(err => console.log('ServiceWorker failed: ', err));
            });
        }
    </script>

    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: var(--dark-black); 
            background-image: url('https://scontent.fcrk3-4.fna.fbcdn.net/v/t39.30808-6/691896653_1494666168708250_282785071666366013_n.jpg?_nc_cat=107&ccb=1-7&_nc_sid=7b2446&_nc_eui2=AeGlzYKtTIgSuDPeJjRKzGxlM2Psjg2A7MUzY-yODYDsxcYvLk1YCJh7IVz3Ius92_PA0zDbliTkVmNsEzmvxcPe&_nc_ohc=Xwb5rFW0-78Q7kNvwFTGaUc&_nc_oc=AdrtcQP4ANyiTT0Dy9KdGiIrPikQTtQ2_p31YZRXgQCqlm3lX0pC8R6OpHQQKgHfkjs&_nc_zt=23&_nc_ht=scontent.fcrk3-4.fna&_nc_gid=U9XRKyz_BnHfSboII9F0iQ&_nc_ss=7b2a8&oh=00_Af4I0CWTBn3ClpQks2dIsbeT-rBrgdi9FR0mLOm-2LgQOA&oe=6A041382');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh; 
            margin: 0; 
            padding: 20px; 
            position: relative;
        }
        .login-container { 
            background: rgba(20, 20, 20, 0.4); 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }
        .login-logo { 
            font-size: 2.8rem; 
            font-weight: 700; 
            margin-bottom: 40px; 
            letter-spacing: 1px; 
            color: #ffffff; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .login-logo span { 
            color: var(--primary-red); 
        }
        .login-form input { 
            width: 100%; 
            padding: 18px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px; 
            outline: none; 
            font-size: 16px; 
            box-sizing: border-box; 
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .login-form input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .login-form input:focus { 
            border-color: rgba(255, 255, 255, 0.5); 
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .login-btn { 
            width: 100%; 
            padding: 18px; 
            background-color: var(--primary-red); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(153, 27, 27, 0.4);
        }
        .login-btn:hover { 
            background-color: #900f14; 
            box-shadow: 0 6px 20px rgba(153, 27, 27, 0.6);
        }
        .login-btn:disabled { 
            background-color: #e0abae; 
            cursor: not-allowed; 
            box-shadow: none;
        }
        #errorMsg { 
            color: #ffb3b3; 
            margin-bottom: 15px; 
            font-size: 14px; 
            display: none; 
            font-weight: 500; 
            line-height: 1.4; 
        }
        #installAppBtn { 
            display: none; 
            width: 100%; 
            padding: 18px; 
            margin-top: 20px; 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s; 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        #installAppBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Links and text colors inside glass */
        p a#forgotPasswordBtn {
            color: rgba(255, 255, 255, 0.8) !important;
            transition: color 0.3s ease;
        }
        p a#forgotPasswordBtn:hover {
            color: #ffffff !important;
        }
        p.desktop-only {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        /* NEW: Mobile specific override */
        @media (max-width: 800px) {
            .desktop-only { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">FIT<span>TRACK</span></div>
        <div id="errorMsg">Invalid email or password.</div>
        
        <form class="login-form" id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email Address" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit" class="login-btn" id="loginSubmitBtn">Log In</button>
        </form>

        <p style="text-align: center; margin-top: 15px;">
            <a href="#" id="forgotPasswordBtn" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Forgot Password?</a>
        </p>

        <p class="desktop-only" style="color: #AAAAAA; font-size: 13px; margin-top: 20px;">
            <i class="fas fa-id-badge"></i> Or simply tap your ID Card to log in.
        </p>

        <button id="installAppBtn">
            <i class="fa-solid fa-download"></i> Install Fit Track App
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginConfig = {
            apiKey: "AIzaSyB5xluf59a0X6v-_TNzR6Ny0mtcjSVWyLA",
            authDomain: "fit-track-ca8d1.firebaseapp.com",
            projectId: "fit-track-ca8d1",
            storageBucket: "fit-track-ca8d1.firebasestorage.app",
            messagingSenderId: "157593985795",
            appId: "1:157593985795:web:07156961dda8e2254fbf36",
            measurementId: "G-NYGGEMMJMC"
        };

        const app = initializeApp(loginConfig);
        const db = getFirestore(app);

        const isMobileDevice = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800;

        // ==========================================
        // SMART USB RFID GHOST LISTENER
        // ==========================================
        let rfidBuffer = "";
        let lastKeyTime = Date.now();

        document.addEventListener('keydown', async (e) => {
            const currentTime = Date.now();
            if (currentTime - lastKeyTime > 50) rfidBuffer = ""; 

            if (e.key === 'Enter' && rfidBuffer.length > 5) {
                e.preventDefault();
                const activeEl = document.activeElement;
                if (activeEl && activeEl.tagName === 'INPUT') {
                    let currentVal = activeEl.value;
                    if (currentVal.endsWith(rfidBuffer)) activeEl.value = currentVal.slice(0, -rfidBuffer.length);
                    activeEl.blur(); 
                }
                const scannedRfid = rfidBuffer;
                rfidBuffer = "";
                await authenticateUser(query(collection(db, "users"), where("rfid", "==", scannedRfid)));
            } else if (e.key.length === 1 && /[a-zA-Z0-9]/.test(e.key)) { 
                rfidBuffer += e.key;
            }
            lastKeyTime = currentTime;
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            await authenticateUser(query(collection(db, "users"), where("email", "==", email), where("password", "==", password)));
        });

        document.getElementById('forgotPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const email = prompt("Enter your email address to reset your password:");
            if (!email) return;
            resetPasswordFlow(email.trim());
        });

        async function resetPasswordFlow(email) {
            const q = query(collection(db, "users"), where("email", "==", email));
            const snap = await getDocs(q);
            if (snap.empty) {
                showToast("No account found with this email.", "error");
                return;
            }
            const userDoc = snap.docs[0];
            const newPass = Math.random().toString(36).slice(-8);

            try {
                await updateDoc(doc(db, "users", userDoc.id), { password: newPass });
                await emailjs.send("service_x90mti6", "template_nda1wjc", {
                    to_name: userDoc.data().name || userDoc.data().givenName,
                    to_email: email,
                    generated_password: newPass,
                    plan: "Password Reset"
                });
                showToast("A new password has been sent to your email.", "success");
            } catch (e) {
                showToast("Error resetting password.", "error");
            }
        }

        async function authenticateUser(dbQuery) {
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('loginSubmitBtn');
            submitBtn.innerText = "Authenticating...";
            submitBtn.disabled = true;
            errorMsg.style.display = "none";

            try {
                const querySnapshot = await getDocs(dbQuery);
                if (querySnapshot.empty) {
                    errorMsg.innerText = "Invalid credentials or unrecognized ID Card.";
                    errorMsg.style.display = "block";
                    submitBtn.innerText = "Log In";
                    submitBtn.disabled = false;
                    return;
                } 
                
                const userDoc = querySnapshot.docs[0];
                const userData = userDoc.data();
                const userId = userDoc.id;
                const userRole = userData.role;
                const userOnMobile = isMobileDevice();

                // 1. ARCHIVE CHECK
                if (userData.status === 'Archived') {
                    errorMsg.innerText = "This account has been archived. Please contact management.";
                    errorMsg.style.display = "block";
                    submitBtn.innerText = "Log In";
                    submitBtn.disabled = false;
                    return;
                }

                // 2. DEVICE RESTRICTION CHECK (Temporarily disabled for testing)
                /*
                if ((userRole === "Admin" || userRole === "Staff") && userOnMobile) {
                    errorMsg.innerText = "Access Denied: Admins/Staff must use Desktop.";
                    errorMsg.style.display = "block";
                    submitBtn.innerText = "Log In";
                    submitBtn.disabled = false;
                    return;
                }

                if ((userRole === "Member" || userRole === "Trainer") && !userOnMobile) {
                    errorMsg.innerText = "Access Denied: Use the Mobile App.";
                    errorMsg.style.display = "block";
                    submitBtn.innerText = "Log In";
                    submitBtn.disabled = false;
                    return;
                }
                */

                // 3. GENERATE UNIQUE SESSION ID TO OVERRIDE ANY PREVIOUS LOGINS
                const newSessionId = Math.random().toString(36).substring(2, 15);
                let updateData = { currentSession: newSessionId };

                if (userRole === "Admin" || userRole === "Staff" || userRole === "Trainer") {
                    const now = Date.now();
                    const status = userRole === "Trainer" ? "On Floor" : "On Shift";
                    updateData.shiftStatus = status;
                    updateData.shiftStart = now;
                    localStorage.setItem("shiftStart", now);
                    if (userRole === "Trainer") {
                        localStorage.setItem("trainerShiftStatus", "On Floor");
                    }
                }

                // Save to Firebase
                await updateDoc(doc(db, "users", userId), updateData);
                
                // Save universally needed items to Local Storage
                localStorage.setItem("userId", userId);
                const displayName = userData.name || `${userData.givenName || ''} ${userData.familyName || ''}`.trim() || "User";
                localStorage.setItem("loggedInUser", displayName);
                localStorage.setItem("userRole", userRole);
                localStorage.setItem("sessionId", newSessionId); // Save Session ID locally!
                if(userData.rfid) localStorage.setItem("userRfid", userData.rfid);

                // Log the login activity
                try {
                    const now = new Date();
                    await addDoc(collection(db, "activityLogs"), {
                        userId: userId,
                        userName: userData.name || userData.givenName,
                        role: userRole,
                        action: "Login",
                        details: `${userRole} logged in.`,
                        date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                        time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                        timestamp: now.getTime()
                    });
                } catch(e) { console.error("Login log failed:", e); }

                // Redirect
                const roleLower = (userRole || "").trim().toLowerCase();
                if (roleLower === "admin") window.location.replace("adminDB.html");
                else if (roleLower === "staff") window.location.replace("staffDB.html");
                else if (roleLower === "trainer") window.location.replace("trainerDB.html");
                else window.location.replace("memberDB.html");
                
            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.innerText = "Connection error. Please try again.";
                errorMsg.style.display = "block";
                submitBtn.innerText = "Log In";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
