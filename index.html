<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fit Track - Login</title>

    <link rel="icon" type="image/png" href="images/icon-192.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/ui.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        emailjs.init("ZqQKGRo5j5KpAhH98");
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('ServiceWorker registered!'))
                    .catch(err => console.log('ServiceWorker failed: ', err));
            });
        }
    </script>
</head>
<body class="login-page">

    <main class="login-card" role="main">
        <h1 class="login-logo">FIT<span>TRACK</span></h1>

        <noscript>
            <div class="login-noscript" role="alert">
                <strong>JavaScript is required.</strong>
                Please enable JavaScript in your browser to sign in.
            </div>
        </noscript>

        <div id="errorMsg" class="login-error" role="alert" aria-live="assertive" aria-atomic="true">
            <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
            <span id="errorMsgText">Invalid email or password.</span>
        </div>

        <form class="login-form" id="loginForm" novalidate aria-describedby="errorMsg">
            <div class="field">
                <label for="loginEmail" class="sr-only">Email address</label>
                <input
                    type="email"
                    id="loginEmail"
                    class="input input-glass"
                    placeholder="Email Address"
                    autocomplete="username"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    inputmode="email"
                    required
                    aria-required="true"
                >
            </div>

            <div class="field">
                <label for="loginPassword" class="sr-only">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    class="input input-glass"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                    aria-required="true"
                >
                <div id="capsLockHint" class="login-hint" role="status" aria-live="polite">
                    <i class="fas fa-arrow-up" aria-hidden="true"></i>
                    <span>Caps Lock is on</span>
                </div>
            </div>

            <button
                type="submit"
                class="btn btn-primary btn-lg btn-block"
                id="loginSubmitBtn"
            >Log In</button>
        </form>

        <p class="login-meta">
            <button type="button" id="forgotPasswordBtn" class="login-meta-link">Forgot Password?</button>
        </p>

        <p class="login-rfid-hint desktop-only">
            <i class="fas fa-id-badge" aria-hidden="true"></i>
            Or simply tap your ID Card to log in.
        </p>

        <!-- Developer & QA Test Console (gated by hostname/dev-flag check below) -->
        <div id="devTestConsole" class="dev-console" hidden>
            <p class="dev-console-label">
                <i class="fas fa-terminal" aria-hidden="true"></i>
                Dev/QA Quick Auto-Login
            </p>
            <div class="dev-console-grid" role="group" aria-label="Developer bypass roles">
                <button type="button" class="btn btn-sm btn-glass" data-bypass-role="admin">Admin</button>
                <button type="button" class="btn btn-sm btn-glass" data-bypass-role="staff">Staff</button>
                <button type="button" class="btn btn-sm btn-glass" data-bypass-role="trainer">Trainer</button>
                <button type="button" class="btn btn-sm btn-glass" data-bypass-role="member">Member</button>
            </div>
        </div>
    </main>

    <script>
        // DEVELOPER & QA TEST BYPASS HOOK
        // Allows testing tools (like Puppeteer, Playwright, or AI agents) to bypass the login screen and test dashboards instantly
        (function() {
            function generateSecureRandomString(length = 8) {
                if (!window.crypto || !window.crypto.getRandomValues) {
                    throw new Error("Cryptographically secure random number generator is unavailable.");
                }
                const buf = new Uint8Array(length);
                window.crypto.getRandomValues(buf);
                return Array.from(buf, b => b.toString(16).padStart(2, '0')).join('');
            }

            // Gate bypass to local/dev environments only — must not be reachable on production.
            const _isLocal = window.location.hostname === 'localhost' ||
                             window.location.hostname === '127.0.0.1' ||
                             window.location.protocol === 'file:' ||
                             new URLSearchParams(window.location.search).has('dev');
            const urlParams = new URLSearchParams(window.location.search);
            const bypassRole = _isLocal ? urlParams.get('bypass') : null;
            if (bypassRole) {
                const roleLower = bypassRole.toLowerCase();
                let role = "";
                let redirectPage = "";
                let userId = "test-user-id";
                let name = "Test User";

                if (roleLower === 'admin') {
                    role = 'Admin';
                    name = 'Test Admin';
                    redirectPage = 'adminDB.html';
                    userId = 'test-admin-id';
                } else if (roleLower === 'staff') {
                    role = 'Staff';
                    name = 'Test Staff';
                    redirectPage = 'staffDB.html';
                    userId = 'test-staff-id';
                } else if (roleLower === 'trainer') {
                    role = 'Trainer';
                    name = 'Test Trainer';
                    redirectPage = 'trainerDB.html';
                    userId = 'test-trainer-id';
                } else if (roleLower === 'member') {
                    role = 'Member';
                    name = 'Test Member';
                    redirectPage = 'memberDB.html';
                    userId = 'test-member-id';
                }

                if (role && redirectPage) {
                    console.log(`Bypassing login for testing role: ${role}`);
                    localStorage.setItem("userId", userId);
                    localStorage.setItem("loggedInUser", name);
                    localStorage.setItem("userRole", role);
                    localStorage.setItem("sessionId", "test-session-" + generateSecureRandomString(4));
                    if (role === 'Admin' || role === 'Staff' || role === 'Trainer') {
                        localStorage.setItem("shiftStart", Date.now());
                        if (role === 'Trainer') {
                            localStorage.setItem("trainerShiftStatus", "On Floor");
                        }
                    }
                    window.location.replace(redirectPage);
                }
            }

            // Check if we are running in local dev / test environment
            window.addEventListener('DOMContentLoaded', () => {
                const isLocal = window.location.hostname === 'localhost' ||
                                window.location.hostname === '127.0.0.1' ||
                                window.location.protocol === 'file:' ||
                                new URLSearchParams(window.location.search).has('dev');
                if (isLocal) {
                    const devConsole = document.getElementById('devTestConsole');
                    if (devConsole) {
                        devConsole.hidden = false;
                        devConsole.querySelectorAll('[data-bypass-role]').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const role = btn.getAttribute('data-bypass-role');
                                window.location.replace(`index.html?bypass=${encodeURIComponent(role)}`);
                            });
                        });
                    }
                }
            });
        })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, enableIndexedDbPersistence, collection, addDoc, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./js/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Enable Offline Persistence for gold-standard Firestore quota optimization.
        enableIndexedDbPersistence(db).catch((err) => {
            if (err.code === 'failed-precondition') {
                console.warn("Firestore persistence failed-precondition (multiple tabs open)");
            } else if (err.code === 'unimplemented') {
                console.warn("Firestore persistence unimplemented in browser");
            }
        });

        const isMobileDevice = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800;

        // ==========================================
        // SMART USB RFID GHOST LISTENER
        // ==========================================
        let rfidBuffer = "";
        let lastKeyTime = Date.now();

        document.addEventListener('keydown', async (e) => {
            const currentTime = Date.now();
            if (currentTime - lastKeyTime > 50) rfidBuffer = ""; 

            if (e.key === 'Enter' && rfidBuffer.length > 5) {
                const activeEl = document.activeElement;
                const isTextInput = activeEl && (
                    activeEl.tagName === 'INPUT' || 
                    activeEl.tagName === 'TEXTAREA' || 
                    activeEl.isContentEditable
                );
                if (isTextInput) {
                    rfidBuffer = "";
                    return;
                }

                e.preventDefault();
                if (activeEl && activeEl.tagName === 'INPUT') {
                    let currentVal = activeEl.value;
                    if (currentVal.endsWith(rfidBuffer)) activeEl.value = currentVal.slice(0, -rfidBuffer.length);
                    activeEl.blur(); 
                }
                const scannedRfid = rfidBuffer;
                rfidBuffer = "";
                await authenticateUser(query(collection(db, "users"), where("rfid", "==", scannedRfid)), null);
            } else if (e.key.length === 1 && /[a-zA-Z0-9]/.test(e.key)) { 
                rfidBuffer += e.key;
            }
            lastKeyTime = currentTime;
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value.trim();

            // VULN-08: reject whitespace-only credentials before hitting Firestore
            if (!email || !password) {
                setError("Please enter your email and password.");
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
                setError("Please enter a valid email address.");
                return;
            }

            await authenticateUser(query(collection(db, "users"), where("email", "==", email)), password);
        });

        document.getElementById('forgotPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            showPrompt({
                title: 'Reset Password',
                message: 'Enter your email address to receive a new password:',
                placeholder: 'your.email@example.com',
                onConfirm: (email) => {
                    const trimmedEmail = email.trim().toLowerCase();
                    // VULN-15: require at least 2-char TLD
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(trimmedEmail)) {
                        return showToast('Please enter a valid email address.', 'error');
                    }
                    resetPasswordFlow(trimmedEmail);
                }
            });
        });

        // Helpers — keep error rendering and aria state in one place
        const errorMsg = document.getElementById('errorMsg');
        const errorMsgText = document.getElementById('errorMsgText');
        const emailInputEl = document.getElementById('loginEmail');
        const passwordInputEl = document.getElementById('loginPassword');
        const capsLockHint = document.getElementById('capsLockHint');

        function setError(text) {
            if (!errorMsg || !errorMsgText) return;
            errorMsgText.innerText = text;
            errorMsg.classList.add('is-visible');
            if (emailInputEl) emailInputEl.setAttribute('aria-invalid', 'true');
            if (passwordInputEl) passwordInputEl.setAttribute('aria-invalid', 'true');
        }

        function clearError() {
            if (!errorMsg) return;
            errorMsg.classList.remove('is-visible');
            if (emailInputEl) emailInputEl.removeAttribute('aria-invalid');
            if (passwordInputEl) passwordInputEl.removeAttribute('aria-invalid');
        }

        // Clear error message when the user starts typing again
        ['loginEmail', 'loginPassword'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', clearError);
        });

        // Caps Lock detection on password field
        if (passwordInputEl && capsLockHint) {
            const updateCapsHint = (e) => {
                const on = typeof e.getModifierState === 'function' && e.getModifierState('CapsLock');
                capsLockHint.classList.toggle('is-visible', !!on);
            };
            passwordInputEl.addEventListener('keydown', updateCapsHint);
            passwordInputEl.addEventListener('keyup', updateCapsHint);
            passwordInputEl.addEventListener('blur', () => capsLockHint.classList.remove('is-visible'));
        }

        async function resetPasswordFlow(email) {
            // Always lowercase the lookup so case variants resolve consistently
            const lookupEmail = (email || '').toLowerCase();
            const genericMsg = "If an account exists with that email, a new password has been sent.";
            try {
                const q = query(collection(db, "users"), where("email", "==", lookupEmail));
                const snap = await getDocs(q);
                if (snap.empty) {
                    // Don't reveal whether the email is registered — anti-enumeration
                    showToast(genericMsg, "success");
                    return;
                }
                const userDoc = snap.docs[0];
                // M9: silently no-op for archived accounts (still show generic message to prevent enumeration)
                const ud = userDoc.data() || {};
                if (ud.status === 'Archived' || ud.archived === true) {
                    showToast(genericMsg, "success");
                    return;
                }
                // Use crypto-strong randomness. Refuse insecure fallbacks.
                if (!window.crypto || !window.crypto.getRandomValues) {
                    throw new Error("SECURE_RANDOM_UNAVAILABLE: Cryptographically secure random number generator is unavailable.");
                }
                const buf = new Uint8Array(9);
                window.crypto.getRandomValues(buf);
                const newPass = btoa(String.fromCharCode(...buf)).replace(/[^A-Za-z0-9]/g, '').slice(0, 10);
                await updateDoc(doc(db, "users", userDoc.id), { password: newPass });
                await emailjs.send("service_x90mti6", "template_nda1wjc", {
                    to_name: userDoc.data().name || userDoc.data().givenName,
                    to_email: lookupEmail,
                    generated_password: newPass,
                    plan: "Password Reset"
                });
                showToast(genericMsg, "success");
            } catch (e) {
                console.error("Password reset failed:", e);
                showToast(genericMsg, "success"); // still generic to avoid leaking
            }
        }

        async function authenticateUser(dbQuery, enteredPassword) {
            const submitBtn = document.getElementById('loginSubmitBtn');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const email = emailInput ? emailInput.value.trim().toLowerCase() : 'unknown';

            const setBusy = (busy) => {
                if (!submitBtn) return;
                submitBtn.classList.toggle('is-loading', busy);
                submitBtn.disabled = busy;
                submitBtn.setAttribute('aria-busy', busy ? 'true' : 'false');
                if (emailInput) emailInput.disabled = busy;
                if (passwordInput) passwordInput.disabled = busy;
            };

            // Check local lockout first for fast feedback
            const localLockoutUntil = Number(localStorage.getItem("loginLockoutUntil") || 0);
            if (Date.now() < localLockoutUntil) {
                const secondsLeft = Math.ceil((localLockoutUntil - Date.now()) / 1000);
                setError(`Too many failed login attempts. Please try again in ${secondsLeft} seconds.`);
                setBusy(false);
                return;
            }

            setBusy(true);
            clearError();

            let redirected = false;
            try {
                const querySnapshot = await getDocs(dbQuery);
                if (querySnapshot.empty) {
                    // Record failed attempt locally since no matching email/rfid doc found
                    let failedCount = Number(localStorage.getItem("loginFailedAttempts") || 0) + 1;
                    localStorage.setItem("loginFailedAttempts", failedCount);

                    if (failedCount >= 5) {
                        const lockTime = Date.now() + 30000;
                        localStorage.setItem("loginLockoutUntil", lockTime);
                        localStorage.setItem("loginFailedAttempts", 0);
                        setError("Too many failed attempts. Access temporarily locked for 30 seconds.");
                    } else {
                        setError(`Invalid credentials or unrecognized ID Card. (${5 - failedCount} attempts remaining)`);
                    }

                    // Log failed attempt to activityLogs
                    try {
                        const now = new Date();
                        await addDoc(collection(db, "activityLogs"), {
                            userId: "system-auth",
                            userName: email || "RFID Visitor",
                            role: "Visitor",
                            action: "Failed Login",
                            details: `Failed login attempt (unrecognized account) for ${email || 'RFID Scanner'}.`,
                            date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                            time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                            timestamp: now.getTime()
                        });
                    } catch(e) { console.error(e); }

                    setBusy(false);
                    return;
                }

                const userDoc = querySnapshot.docs[0];
                const userData = userDoc.data();
                const userId = userDoc.id;
                const userRole = userData.role;

                // ARCHIVE CHECK
                if (userData.status === 'Archived') {
                    setError("This account has been archived. Please contact management.");
                    setBusy(false);
                    return;
                }

                // Check Firestore lock status
                const dbLockoutUntil = Number(userData.lockoutUntil || 0);
                if (Date.now() < dbLockoutUntil) {
                    const secondsLeft = Math.ceil((dbLockoutUntil - Date.now()) / 1000);
                    setError(`Too many failed login attempts. Please try again in ${secondsLeft} seconds.`);
                    setBusy(false);
                    return;
                }

                // Password Verification (if password is supplied)
                if (enteredPassword !== null) {
                    if (userData.password !== enteredPassword) {
                        // Failed password attempt
                        let dbFailedCount = Number(userData.failedAttempts || 0) + 1;
                        if (dbFailedCount >= 5) {
                            const dbLockTime = Date.now() + 30000;
                            await updateDoc(doc(db, "users", userId), { failedAttempts: 0, lockoutUntil: dbLockTime });
                            localStorage.setItem("loginLockoutUntil", dbLockTime); // sync locally
                            setError("Too many failed attempts. Access temporarily locked for 30 seconds.");
                        } else {
                            await updateDoc(doc(db, "users", userId), { failedAttempts: dbFailedCount });
                            setError(`Invalid credentials or unrecognized ID Card. (${5 - dbFailedCount} attempts remaining)`);
                        }

                        // Log failed attempt to activityLogs
                        try {
                            const now = new Date();
                            await addDoc(collection(db, "activityLogs"), {
                                userId: userId,
                                userName: userData.name || `${userData.givenName} ${userData.familyName}`,
                                role: userRole,
                                action: "Failed Login",
                                details: `Failed password login attempt for ${email}.`,
                                date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                                time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                                timestamp: now.getTime()
                            });
                        } catch(e) { console.error(e); }

                        setBusy(false);
                        return;
                    }
                }

                // Successful authentication! Reset failed attempts in local storage and database
                localStorage.removeItem("loginFailedAttempts");
                localStorage.removeItem("loginLockoutUntil");
                if (userData.failedAttempts || userData.lockoutUntil) {
                    await updateDoc(doc(db, "users", userId), { failedAttempts: 0, lockoutUntil: 0 });
                }

                const userOnMobile = isMobileDevice();

                // GENERATE UNIQUE SESSION ID TO OVERRIDE ANY PREVIOUS LOGINS
                if (!window.crypto || !window.crypto.getRandomValues) {
                    throw new Error("SECURE_RANDOM_UNAVAILABLE: Cryptographically secure random number generator is unavailable.");
                }
                const buf = new Uint8Array(16);
                window.crypto.getRandomValues(buf);
                const newSessionId = Array.from(buf, b => b.toString(16).padStart(2, '0')).join('');
                let updateData = { currentSession: newSessionId };

                if (userRole === "Admin" || userRole === "Staff" || userRole === "Trainer") {
                    const now = Date.now();
                    const status = userRole === "Trainer" ? "On Floor" : "On Shift";
                    updateData.shiftStatus = status;
                    updateData.shiftStart = now;
                    localStorage.setItem("shiftStart", now);
                    if (userRole === "Trainer") {
                        localStorage.setItem("trainerShiftStatus", "On Floor");
                    }
                }

                // Save to Firebase
                await updateDoc(doc(db, "users", userId), updateData);
                
                // Save universally needed items to Local Storage
                localStorage.setItem("userId", userId);
                const displayName = userData.name || `${userData.givenName || ''} ${userData.familyName || ''}`.trim() || "User";
                localStorage.setItem("loggedInUser", displayName);
                localStorage.setItem("userRole", userRole);
                localStorage.setItem("sessionId", newSessionId); // Save Session ID locally!
                localStorage.setItem("loginAt", Date.now().toString()); // For session expiry check on dashboard load
                if(userData.rfid) localStorage.setItem("userRfid", userData.rfid);

                // Log the login activity
                try {
                    const now = new Date();
                    await addDoc(collection(db, "activityLogs"), {
                        userId: userId,
                        userName: userData.name || userData.givenName,
                        role: userRole,
                        action: "Login",
                        details: `${userRole} logged in.`,
                        date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                        time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                        timestamp: now.getTime()
                    });
                } catch(e) { console.error("Login log failed:", e); }

                // Redirect
                const roleLower = (userRole || "").trim().toLowerCase();
                redirected = true;
                if (roleLower === "admin") window.location.replace("adminDB.html");
                else if (roleLower === "staff") window.location.replace("staffDB.html");
                else if (roleLower === "trainer") window.location.replace("trainerDB.html");
                else window.location.replace("memberDB.html");

            } catch (error) {
                console.error("Login Error:", error);
                setError("Connection error. Please try again.");
            } finally {
                // Only restore the button if we are not navigating away — avoids
                // a brief "Log In" flash before redirect, and guarantees the form
                // is usable again on any failure path.
                if (!redirected) setBusy(false);
            }
        }
    </script>
</body>
</html>
